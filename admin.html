<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#12161C; --panel:#1B212B; --panel-2:#212A37; --border:#2B3441; --border-soft:#242C38;
  --text:#EDEEF0; --muted:#8B93A1; --muted-2:#5C6472;
  --amber:#E8A33D; --teal:#4FB6A6; --teal-dim:#1C3934; --rust:#D96A5A; --rust-dim:#3D2321;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;}
h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-0.02em;}
h2{font-family:var(--font-display);font-size:21px;margin:0 0 4px 0;}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px 0;line-height:1.5;}
.btn{border-radius:10px;border:1px solid var(--border);padding:13px 20px;font-size:15px;font-weight:600;background:var(--panel-2);color:var(--text);transition:background .15s;}
.btn:hover{background:#283040;}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1A1206;}
.btn-primary:hover{background:#f0ad4d;}
.btn-ghost{background:transparent;}
.btn-large{width:100%;padding:15px;font-size:15.5px;}
.btn-small{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-danger{color:var(--rust);border-color:var(--rust-dim);background:var(--rust-dim);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pin-input{width:100%;padding:14px;font-size:22px;letter-spacing:6px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:14px;font-family:var(--font-mono);}
.text-input{width:100%;padding:12px;font-size:15px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);margin-bottom:12px;}
.error-text{color:var(--rust);font-size:13px;margin:-6px 0 14px 0;}
.success-text{color:var(--teal);font-size:13px;margin:8px 0;}
.outlet-shell{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.outlet-topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 20px;}
.outlet-name{font-family:var(--font-display);font-size:19px;}
.outlet-date{color:var(--muted);font-size:13px;font-family:var(--font-mono);}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.item-card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.item-card-name{font-weight:600;font-size:15px;}
.item-card-unit{color:var(--muted-2);font-size:12px;}
.qty-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qty-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.qty-field input{width:100%;padding:12px;font-size:17px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font-mono);}
.qty-field input:focus{border-color:var(--amber);}
.submit-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 60%,transparent);padding:16px 0 0;}
.banner{background:var(--teal-dim);border:1px solid #2b5850;color:var(--teal);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.confirm-wrap{text-align:center;padding-top:60px;}
.confirm-check{font-size:48px;color:var(--teal);margin-bottom:12px;}
.admin-shell{max-width:1080px;margin:0 auto;padding:20px 20px 60px;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.admin-title{font-family:var(--font-display);font-size:20px;}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content;}
.tab-btn{background:transparent;border:none;padding:9px 16px;border-radius:7px;color:var(--muted);font-size:13.5px;font-weight:600;}
.tab-btn.active{background:var(--amber);color:#1A1206;}
.status-strip{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.status-strip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.status-strip-title{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.status-strip-count{font-family:var(--font-mono);font-size:13px;color:var(--muted);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--border);background:var(--panel-2);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:var(--teal);} .dot-pending{background:var(--rust);}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.field select,.field input[type=date]{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.summary-card .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.summary-card .value{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.outlet-group{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.outlet-group-head{padding:13px 18px;border-bottom:1px solid var(--border-soft);font-weight:600;font-size:14px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 18px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
td{padding:11px 18px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--font-mono);}
td.name-col{font-family:var(--font-body);white-space:normal;}
tr:last-child td{border-bottom:none;}
.stock-neg{color:var(--rust);}
.empty-state{color:var(--muted);text-align:center;padding:50px 20px;font-size:14px;}
.outlet-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.outlet-card-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.outlet-card-info .name{font-weight:600;font-size:15px;}
.outlet-card-info .meta{color:var(--muted-2);font-size:12px;font-family:var(--font-mono);margin-top:2px;}
.outlet-card-actions{display:flex;gap:8px;}
.items-panel{border-top:1px solid var(--border-soft);padding:14px 18px;background:var(--bg);}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);gap:10px;flex-wrap:wrap;}
.item-row:last-child{border-bottom:none;}
.item-row .iname{font-weight:500;font-size:13.5px;}
.item-row .imeta{color:var(--muted);font-size:12px;font-family:var(--font-mono);}
.item-row-actions{display:flex;gap:6px;}
.section-title{font-family:var(--font-display);font-size:16px;margin:0 0 12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(8,10,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;width:100%;max-width:400px;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.form-field input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:14.5px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.apply-row{display:flex;align-items:flex-end;}
.spinner-text{color:var(--muted);font-size:13.5px;padding:30px;text-align:center;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

.modal-wide{max-width:560px;}
.modal textarea{width:100%;min-height:220px;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12.5px;font-family:var(--font-mono);}
.ingredient-qty{font-family:var(--font-mono);color:var(--text);}
.inline-input{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;width:110px;}
.inline-input:focus{border-color:var(--amber);}
</style>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6PTSf3sC-ZtOgUujLrNhYExBq_7lFgJQ",
  authDomain: "inventory-65a2c.firebaseapp.com",
  databaseURL: "https://inventory-65a2c-default-rtdb.firebaseio.com",
  projectId: "inventory-65a2c",
  storageBucket: "inventory-65a2c.firebasestorage.app",
  messagingSenderId: "702447876159",
  appId: "1:702447876159:web:f888ace2ef5037f86fa08a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,n){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtDate(s){ const [y,m,d]=s.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d+' '+months[Number(m)-1]+' '+y; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

let state = {
  screen: 'checking',
  loginError: '',
  config: {},
  brands: {},
  tab: 'dashboard',
  expandedOutletId: null,
  expandedBrandId: null,
  expandedProductId: null,
  modal: null,
  today: todayStr(),
  filter: { outletId:'all', startDate: todayStr().slice(0,8)+'01', endDate: todayStr() },
  data: null,
  productData: null,
  loading: false,
  statusToday: new Set(),
  inlineErrors: {},
};

function ingredientsOf(outlet){ const b = state.brands[outlet.brandId]; return (b && b.ingredients) ? b.ingredients : []; }
function stockFor(outlet, ingredientId, createdAt){
  const s = (outlet.itemStock && outlet.itemStock[ingredientId]) ? outlet.itemStock[ingredientId] : null;
  return s || { opening: 0, baselineDate: createdAt || '2000-01-01' };
}
function variantIndex(brand){
  const idx = {};
  for(const prod of (brand.products||[])) for(const v of (prod.variants||[])) idx[v.id] = { productName: prod.name, variantName: v.name, recipe: v.recipe||[] };
  return idx;
}

auth.onAuthStateChanged(function(user){
  if(user){ state.screen = 'admin'; render(); loadAll().then(()=>{ refreshStatus(); loadData(); }); }
  else { state.screen = 'login'; render(); }
});

async function loadAll(){
  const [configSnap, brandsSnap] = await Promise.all([ db.ref('config').once('value'), db.ref('brands').once('value') ]);
  state.config = configSnap.val() || {};
  state.brands = brandsSnap.val() || {};
  render();
}

async function submitLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  state.loginError = '';
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ state.loginError = 'Login failed. Check your email and password.'; render(); }
}
function logout(){ auth.signOut(); }

async function refreshStatus(){
  const ids = Object.keys(state.config);
  const results = await Promise.all(ids.map(id => db.ref('entries/'+id+'/'+state.today).once('value').then(s=>({id, exists: s.exists()}))));
  state.statusToday = new Set(results.filter(r=>r.exists).map(r=>r.id));
  render();
}

function setFilter(field, val){ state.filter[field] = val; }
function setTab(tab){ state.tab = tab; render(); }

async function loadData(){
  state.loading = true; state.data = null; state.productData = null; render();
  const outletIds = state.filter.outletId==='all' ? Object.keys(state.config) : [state.filter.outletId];
  const ingredientResults = [];
  const productResults = [];
  for(const outletId of outletIds){
    const outlet = state.config[outletId];
    if(!outlet) continue;
    const brand = state.brands[outlet.brandId] || {ingredients:[],products:[]};
    const ingredients = ingredientsOf(outlet);
    if(ingredients.length===0 && (brand.products||[]).length===0) continue;
    const vIdx = variantIndex(brand);

    let earliestBaseline = null;
    for(const ing of ingredients){
      const s = stockFor(outlet, ing.id, ing.createdAt);
      if(earliestBaseline===null || s.baselineDate < earliestBaseline) earliestBaseline = s.baselineDate;
    }
    if(earliestBaseline===null) earliestBaseline = state.filter.startDate;
    const fetchStart = earliestBaseline < state.filter.startDate ? earliestBaseline : state.filter.startDate;

    const snap = await db.ref('entries/'+outletId).orderByKey().startAt(fetchStart).endAt(state.filter.endDate).once('value');
    const byDate = snap.val() || {};

    const ingAgg = {};
    for(const ing of ingredients) ingAgg[ing.id] = {cumPurchased:0,cumSold:0,rangePurchased:0,rangeSold:0};
    const prodAgg = {};

    for(const date in byDate){
      const day = byDate[date];
      const inRange = date >= state.filter.startDate && date <= state.filter.endDate;
      for(const ingId in (day.purchases||{})){
        if(!ingAgg[ingId]) continue;
        const factor = (ingredients.find(i=>i.id===ingId)||{}).purchaseFactor || 1;
        const baseQty = (day.purchases[ingId]||0) * factor;
        ingAgg[ingId].cumPurchased += baseQty;
        if(inRange) ingAgg[ingId].rangePurchased += baseQty;
      }
      for(const variantId in (day.sales||{})){
        const soldCount = day.sales[variantId]||0;
        if(inRange) prodAgg[variantId] = (prodAgg[variantId]||0) + soldCount;
        const info = vIdx[variantId];
        if(!info) continue;
        for(const line of info.recipe){
          if(!ingAgg[line.ingredientId]) continue;
          const deduct = soldCount * (line.qty||0);
          ingAgg[line.ingredientId].cumSold += deduct;
          if(inRange) ingAgg[line.ingredientId].rangeSold += deduct;
        }
      }
    }

    for(const ing of ingredients){
      const s = stockFor(outlet, ing.id, ing.createdAt);
      const a = ingAgg[ing.id];
      const periodOpening = s.opening + (a.cumPurchased - a.rangePurchased) - (a.cumSold - a.rangeSold);
      ingredientResults.push({ outletId, outletName: outlet.name, ingredientId: ing.id, name: ing.name, unit: ing.unit, periodOpening, rangePurchased: a.rangePurchased, rangeSold: a.rangeSold, stockLeft: s.opening + a.cumPurchased - a.cumSold });
    }
    for(const variantId in vIdx){
      if(!prodAgg[variantId]) continue;
      productResults.push({ outletId, outletName: outlet.name, label: vIdx[variantId].productName+' — '+vIdx[variantId].variantName, soldCount: prodAgg[variantId] });
    }
  }
  state.data = ingredientResults;
  state.productData = productResults;
  state.loading = false;
  render();
}

/* ---- brands / ingredients / products ---- */
function openModal(m){ state.modal = m; render(); }
function closeModal(){ state.modal = null; render(); }
function setModalError(msg){ state.modal.error = msg; render(); }
function toggleExpandBrand(id){ state.expandedBrandId = state.expandedBrandId===id ? null : id; render(); }
function toggleExpandProduct(id){ state.expandedProductId = state.expandedProductId===id ? null : id; render(); }

async function saveNewBrand(){
  const name = document.getElementById('m_brandName').value.trim();
  if(!name){ setModalError('Enter a brand name.'); return; }
  const id = genId();
  try{ await db.ref('brands/'+id).set({ name, ingredients: [], products: [] }); state.brands[id] = { name, ingredients: [], products: [] }; }
  catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; render();
}

async function deleteBrand(brandId){
  const outletsUsingBrand = Object.values(state.config).filter(o=>o.brandId===brandId);
  if(outletsUsingBrand.length>0){ alert('Cannot delete: outlets are still using this brand.'); return; }
  try{ await db.ref('brands/'+brandId).remove(); delete state.brands[brandId]; }catch(e){}
  render();
}

async function saveNewIngredient(){
  const brandId = state.modal.brandId;
  const brand = state.brands[brandId];
  const name = document.getElementById('m_ingName').value.trim();
  const unit = document.getElementById('m_ingUnit').value.trim() || 'unit';
  const purchaseUnit = document.getElementById('m_ingPUnit').value.trim() || unit;
  const purchaseFactor = Number(document.getElementById('m_ingFactor').value) || 1;
  if(!name){ setModalError('Enter an ingredient name.'); return; }
  const ingredients = (brand.ingredients||[]).concat([{ id: genId(), name, unit, purchaseUnit, purchaseFactor, createdAt: todayStr() }]);
  try{ await db.ref('brands/'+brandId+'/ingredients').set(ingredients); brand.ingredients = ingredients; }
  catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; render();
}

async function saveInlinePurchaseSize(brandId, ingredientId){
  const suEl = document.getElementById('su_'+ingredientId);
  const puEl = document.getElementById('pu_'+ingredientId);
  const pfEl = document.getElementById('pf_'+ingredientId);
  const unit = suEl.value;
  const purchaseUnit = puEl.value.trim();
  const purchaseFactorRaw = pfEl.value;

  if(!purchaseUnit || purchaseFactorRaw===''){
    state.inlineErrors[ingredientId] = 'Enter both the purchase unit and the quantity.';
    render(); return;
  }
  delete state.inlineErrors[ingredientId];
  const brand = state.brands[brandId];
  const ingredients = (brand.ingredients||[]).map(i => i.id===ingredientId ? Object.assign({}, i, { unit, purchaseUnit, purchaseFactor: Number(purchaseFactorRaw) }) : i);
  try{
    await db.ref('brands/'+brandId+'/ingredients').set(ingredients);
    brand.ingredients = ingredients;
    state.data = null;
  }catch(e){ state.inlineErrors[ingredientId] = 'Could not save. Try again.'; }
  render();
}

async function saveEditIngredient(){
  const { brandId, ingredientId } = state.modal;
  const brand = state.brands[brandId];
  const name = document.getElementById('m_ingName').value.trim();
  const unit = document.getElementById('m_ingUnit').value.trim() || 'unit';
  const purchaseUnit = document.getElementById('m_ingPUnit').value.trim();
  const purchaseFactorRaw = document.getElementById('m_ingFactor').value;
  if(!name){ setModalError('Enter an ingredient name.'); return; }
  if(!purchaseUnit || purchaseFactorRaw===''){ setModalError('Enter the purchase unit and how many stock units it equals \u2014 don\'t leave this blank.'); return; }
  const purchaseFactor = Number(purchaseFactorRaw);
  const ingredients = (brand.ingredients||[]).map(i => i.id===ingredientId ? Object.assign({}, i, { name, unit, purchaseUnit, purchaseFactor }) : i);
  try{ await db.ref('brands/'+brandId+'/ingredients').set(ingredients); brand.ingredients = ingredients; }
  catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; state.data = null; render();
}

async function deleteIngredient(brandId, ingId){
  const brand = state.brands[brandId];
  const ingredients = (brand.ingredients||[]).filter(i=>i.id!==ingId);
  try{ await db.ref('brands/'+brandId+'/ingredients').set(ingredients); brand.ingredients = ingredients; }catch(e){}
  render();
}

async function deleteProduct(brandId, prodId){
  const brand = state.brands[brandId];
  const products = (brand.products||[]).filter(p=>p.id!==prodId);
  try{ await db.ref('brands/'+brandId+'/products').set(products); brand.products = products; }catch(e){}
  render();
}

async function importBrandData(){
  const brandId = state.modal.brandId;
  const brand = state.brands[brandId];
  let parsed;
  try{ parsed = JSON.parse(document.getElementById('m_importJson').value); }
  catch(e){ setModalError('That doesn\'t look like valid JSON.'); return; }

  const ingredients = (brand.ingredients||[]).slice();
  const nameToId = {};
  ingredients.forEach((ing,idx) => { nameToId[ing.name.toLowerCase()] = idx; });
  for(const ing of (parsed.ingredients||[])){
    const key = ing.name.toLowerCase();
    if(nameToId[key]===undefined){
      const idx = ingredients.length;
      ingredients.push({ id: genId(), name: ing.name, unit: ing.unit||'unit', purchaseUnit: null, purchaseFactor: null, recipeUnit: null, recipeUnitFactor: null, createdAt: todayStr() });
      nameToId[key] = idx;
    }
    const existing = ingredients[nameToId[key]];
    const updated = Object.assign({}, existing);
    if(ing.unit) updated.unit = ing.unit;
    if(ing.purchaseUnit && ing.purchaseFactor!=null){ updated.purchaseUnit = ing.purchaseUnit; updated.purchaseFactor = Number(ing.purchaseFactor); }
    if(ing.recipeUnit && ing.recipeUnitFactor!=null){ updated.recipeUnit = ing.recipeUnit; updated.recipeUnitFactor = Number(ing.recipeUnitFactor); }
    ingredients[nameToId[key]] = updated;
  }

  const products = (brand.products||[]).slice();
  const prodNameToIdx = {};
  products.forEach((p,i)=>{ prodNameToIdx[p.name.toLowerCase()] = i; });
  for(const prod of (parsed.products||[])){
    const variants = (prod.variants||[]).map(v => ({
      id: genId(), name: v.name,
      recipe: (v.recipe||[]).map(r => {
        const idx = nameToId[(r.ingredient||'').toLowerCase()];
        const ingredientId = idx!==undefined ? ingredients[idx].id : undefined;
        return { ingredientId, qty: Number(r.qty)||0 };
      }).filter(r=>r.ingredientId)
    }));
    const key = prod.name.toLowerCase();
    if(prodNameToIdx[key]!==undefined) products[prodNameToIdx[key]] = { id: products[prodNameToIdx[key]].id, name: prod.name, variants };
    else products.push({ id: genId(), name: prod.name, variants });
  }

  try{
    await db.ref('brands/'+brandId+'/ingredients').set(ingredients);
    await db.ref('brands/'+brandId+'/products').set(products);
    brand.ingredients = ingredients; brand.products = products;
  }catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; render();
}

/* ---- outlets ---- */
async function saveNewOutlet(){
  const name = document.getElementById('m_outletName').value.trim();
  const pin = document.getElementById('m_outletPin').value.trim();
  const brandId = document.getElementById('m_outletBrand').value;
  if(!name || !pin){ setModalError('Enter a name and PIN.'); return; }
  if(!brandId){ setModalError('Select a brand.'); return; }
  if(state.config[pin]){ setModalError('That PIN is already used by another outlet.'); return; }
  try{ await db.ref('config/'+pin).set({ name, brandId, itemStock: {} }); state.config[pin] = { name, brandId, itemStock: {} }; }
  catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; render();
}

async function deleteOutlet(outletId){
  try{ await db.ref('config/'+outletId).remove(); delete state.config[outletId]; }catch(e){}
  render();
}
function toggleExpandOutlet(id){ state.expandedOutletId = state.expandedOutletId===id ? null : id; render(); }

async function saveStockTake(){
  const { outletId, ingredientId } = state.modal;
  const outlet = state.config[outletId];
  const counted = document.getElementById('m_countedStock').value;
  if(counted===''){ setModalError('Enter the counted stock.'); return; }
  const itemStock = Object.assign({}, outlet.itemStock, { [ingredientId]: { opening: Number(counted)||0, baselineDate: todayStr() } });
  try{ await db.ref('config/'+outletId+'/itemStock').set(itemStock); outlet.itemStock = itemStock; }
  catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null; state.data = null; render();
}

/* ================= render ================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='checking') html = '<div class="center-wrap"><div class="spinner-text">Loading…</div></div>';
  else if(state.screen==='login') html = renderLogin();
  else if(state.screen==='admin') html = renderAdmin();
  app.innerHTML = html + (state.modal ? renderModal() : '');
}

function renderLogin(){
  return '<div class="center-wrap"><div class="card">'
    + '<h2>Admin Sign-in</h2><p class="sub">Full access to setup and dashboard.</p>'
    + '<input id="emailInput" class="text-input" type="email" placeholder="Email" autofocus>'
    + '<input id="passInput" class="text-input" type="password" placeholder="Password" onkeydown="if(event.key===\'Enter\')submitLogin()">'
    + (state.loginError ? '<div class="error-text">'+escapeHtml(state.loginError)+'</div>' : '')
    + '<button class="btn btn-primary btn-large" onclick="submitLogin()">Sign in</button></div></div>';
}

function renderAdmin(){
  let body = '';
  if(state.tab==='dashboard') body = renderDashboardTab();
  else if(state.tab==='brands') body = renderBrandsTab();
  else if(state.tab==='manage') body = renderManageTab();
  return '<div class="admin-shell">'
    + '<div class="admin-topbar"><div class="admin-title">Ops Admin</div><button class="btn btn-ghost btn-small" onclick="logout()">Logout</button></div>'
    + '<div class="tabs">'
    + '<button class="tab-btn '+(state.tab==='dashboard'?'active':'')+'" onclick="setTab(\'dashboard\')">Dashboard</button>'
    + '<button class="tab-btn '+(state.tab==='brands'?'active':'')+'" onclick="setTab(\'brands\')">Brands</button>'
    + '<button class="tab-btn '+(state.tab==='manage'?'active':'')+'" onclick="setTab(\'manage\')">Outlets</button>'
    + '</div>' + body + '</div>';
}

function renderDashboardTab(){
  const outletIds = Object.keys(state.config);
  const total = outletIds.length;
  const submitted = state.statusToday.size;
  let chips = '';
  for(const id of outletIds){
    const ok = state.statusToday.has(id);
    chips += '<span class="chip"><span class="dot '+(ok?'dot-ok':'dot-pending')+'"></span>'+escapeHtml(state.config[id].name)+'</span>';
  }
  if(total===0) chips = '<span style="color:var(--muted-2);font-size:13px;">No outlets set up yet.</span>';
  let outletOptions = '<option value="all">All Outlets</option>';
  for(const id of outletIds) outletOptions += '<option value="'+id+'" '+(state.filter.outletId===id?'selected':'')+'>'+escapeHtml(state.config[id].name)+'</option>';
  const statusStrip = '<div class="status-strip"><div class="status-strip-head"><span class="status-strip-title">Today\'s Submissions</span><span class="status-strip-count">'+submitted+' / '+total+'</span></div><div class="chip-row">'+chips+'</div></div>';
  const filters = '<div class="filters">'
    + '<div class="field"><label>Outlet</label><select onchange="setFilter(\'outletId\',this.value)">'+outletOptions+'</select></div>'
    + '<div class="field"><label>From</label><input type="date" value="'+state.filter.startDate+'" onchange="setFilter(\'startDate\',this.value)"></div>'
    + '<div class="field"><label>To</label><input type="date" value="'+state.filter.endDate+'" onchange="setFilter(\'endDate\',this.value)"></div>'
    + '<div class="field apply-row"><button class="btn btn-primary btn-small" onclick="loadData()">Apply</button></div></div>';

  let resultsHtml = '';
  if(state.loading){ resultsHtml = '<div class="spinner-text">Crunching the numbers…</div>'; }
  else if((!state.data || state.data.length===0) && (!state.productData || state.productData.length===0)){ resultsHtml = '<div class="empty-state">No data for this selection yet.</div>'; }
  else {
    const byOutletIng = {}; for(const r of (state.data||[])){ (byOutletIng[r.outletId]=byOutletIng[r.outletId]||[]).push(r); }
    const byOutletProd = {}; for(const r of (state.productData||[])){ (byOutletProd[r.outletId]=byOutletProd[r.outletId]||[]).push(r); }
    const allOutletIds = new Set(Object.keys(byOutletIng).concat(Object.keys(byOutletProd)));
    let groups = '';
    for(const outletId of allOutletIds){
      const ingRows = byOutletIng[outletId] || [];
      const prodRows = byOutletProd[outletId] || [];
      const outletName = (ingRows[0]||prodRows[0]).outletName;
      let prodTrs = ''; for(const r of prodRows){ prodTrs += '<tr><td class="name-col">'+escapeHtml(r.label)+'</td><td>'+r.soldCount.toLocaleString()+'</td></tr>'; }
      const prodTable = prodRows.length ? '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Sold</th></tr></thead><tbody>'+prodTrs+'</tbody></table></div>' : '';
      let ingTrs = ''; for(const r of ingRows){ ingTrs += '<tr><td class="name-col">'+escapeHtml(r.name)+'</td><td>'+escapeHtml(r.unit)+'</td><td>'+r.periodOpening.toLocaleString()+'</td><td>'+r.rangePurchased.toLocaleString()+'</td><td>'+r.rangeSold.toLocaleString()+'</td><td class="'+(r.stockLeft<0?'stock-neg':'')+'">'+r.stockLeft.toLocaleString()+'</td></tr>'; }
      const ingTable = ingRows.length ? '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th>Opening</th><th>Purchased</th><th>Depleted</th><th>Stock Left</th></tr></thead><tbody>'+ingTrs+'</tbody></table></div>' : '';
      groups += '<div class="outlet-group"><div class="outlet-group-head">'+escapeHtml(outletName)+'</div>'+prodTable+ingTable+'</div>';
    }
    resultsHtml = groups;
  }
  return statusStrip + filters + resultsHtml;
}

function renderBrandsTab(){
  const ids = Object.keys(state.brands);
  let cards = '';
  if(ids.length===0) cards = '<div class="empty-state">No brands yet. Add your first one below.</div>';
  for(const brandId of ids){
    const brand = state.brands[brandId];
    const expanded = state.expandedBrandId===brandId;
    let inner = '';
    if(expanded){
      let ingRows = '';
      for(const ing of (brand.ingredients||[])){
        const pu = ing.purchaseUnit || '';
        const pf = ing.purchaseFactor!=null ? ing.purchaseFactor : '';
        const err = state.inlineErrors[ing.id];
        const uomOptions = ['g','kg','ml','ltr','pc'].map(u => '<option value="'+u+'" '+(ing.unit===u?'selected':'')+'>'+u+'</option>').join('');
        ingRows += '<div class="item-row" style="flex-direction:column;align-items:stretch;gap:8px;">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><div class="iname">'+escapeHtml(ing.name)+'</div>'
          + '<div style="display:flex;align-items:center;gap:6px;"><span style="font-size:12px;color:var(--muted);">Stock Unit (matches recipe)</span><select class="inline-input" style="width:80px;" id="su_'+ing.id+'" onchange="document.getElementById(\'unitlbl_'+ing.id+'\').textContent=this.value;">'+uomOptions+'</select>'
          + '<button class="btn btn-small btn-danger" onclick="deleteIngredient(\''+brandId+'\',\''+ing.id+'\')">Delete</button></div></div>'
          + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">'
          + '<span style="font-size:12px;color:var(--muted);">Purchased as: 1</span>'
          + '<input class="inline-input" id="pu_'+ing.id+'" placeholder="e.g. kg, Bottle" value="'+escapeHtml(pu)+'">'
          + '<span style="font-size:12px;color:var(--muted);">=</span>'
          + '<input class="inline-input" type="number" inputmode="decimal" id="pf_'+ing.id+'" placeholder="e.g. 750" value="'+pf+'" style="width:80px;">'
          + '<span style="font-size:12px;color:var(--muted);" id="unitlbl_'+ing.id+'">'+escapeHtml(ing.unit)+'</span>'
          + '<button class="btn btn-small btn-primary" onclick="saveInlinePurchaseSize(\''+brandId+'\',\''+ing.id+'\')">Save</button>'
          + '</div>'
          + (err ? '<div class="error-text" style="margin:0;">'+escapeHtml(err)+'</div>' : '')
          + '</div>';
      }
      if(!brand.ingredients || brand.ingredients.length===0) ingRows = '<div style="color:var(--muted-2);font-size:13px;padding:6px 0;">No ingredients yet.</div>';

      let prodRows = '';
      for(const prod of (brand.products||[])){
        const pExpanded = state.expandedProductId===prod.id;
        let variantLines = '';
        if(pExpanded){
          for(const v of (prod.variants||[])){
            let lineItems = '';
            for(const r of (v.recipe||[])){
              const ing = (brand.ingredients||[]).find(i=>i.id===r.ingredientId);
              lineItems += '<div style="display:flex;justify-content:space-between;padding:3px 0 3px 14px;font-size:12.5px;"><span style="color:var(--muted);">'+escapeHtml(ing?ing.name:'(deleted ingredient)')+'</span><span class="ingredient-qty">'+r.qty+' '+escapeHtml(ing?ing.unit:'')+'</span></div>';
            }
            variantLines += '<div style="padding:8px 0 4px;"><b style="color:var(--text);font-size:13px;">'+escapeHtml(v.name)+'</b>'+lineItems+'</div>';
          }
        }
        prodRows += '<div class="item-row" style="flex-direction:column;align-items:stretch;">'
          + '<div style="display:flex;justify-content:space-between;align-items:center;width:100%;"><div><div class="iname">'+escapeHtml(prod.name)+'</div><div class="imeta">'+(prod.variants?prod.variants.length:0)+' variants</div></div>'
          + '<div class="item-row-actions"><button class="btn btn-small btn-ghost" onclick="toggleExpandProduct(\''+prod.id+'\')">'+(pExpanded?'Hide':'View Recipe')+'</button><button class="btn btn-small btn-danger" onclick="deleteProduct(\''+brandId+'\',\''+prod.id+'\')">Delete</button></div></div>'
          + variantLines + '</div>';
      }
      if(!brand.products || brand.products.length===0) prodRows = '<div style="color:var(--muted-2);font-size:13px;padding:6px 0;">No products yet.</div>';

      inner = '<div class="items-panel">'
        + '<div class="section-title" style="font-size:13px;">Ingredients</div>' + ingRows
        + '<div style="margin:10px 0;"><button class="btn btn-small btn-ghost" onclick="openModal({type:\'addIngredient\',brandId:\''+brandId+'\'})">+ Add Ingredient</button></div>'
        + '<div class="section-title" style="font-size:13px;margin-top:16px;">Products &amp; Recipes</div>' + prodRows
        + '<div style="margin-top:10px;"><button class="btn btn-small btn-ghost" onclick="openModal({type:\'importJson\',brandId:\''+brandId+'\'})">Import Recipes (JSON)</button></div>'
        + '</div>';
    }
    const outletCount = Object.values(state.config).filter(o=>o.brandId===brandId).length;
    cards += '<div class="outlet-card"><div class="outlet-card-head"><div class="outlet-card-info"><div class="name">'+escapeHtml(brand.name)+'</div><div class="meta">'+(brand.ingredients?brand.ingredients.length:0)+' ingredients · '+(brand.products?brand.products.length:0)+' products · '+outletCount+' outlets</div></div>'
      + '<div class="outlet-card-actions"><button class="btn btn-small" onclick="toggleExpandBrand(\''+brandId+'\')">'+(expanded?'Hide':'Manage')+'</button><button class="btn btn-small btn-danger" onclick="deleteBrand(\''+brandId+'\')">Delete Brand</button></div></div>' + inner + '</div>';
  }
  return '<h2 class="section-title">Brands</h2>' + cards + '<button class="btn btn-primary btn-small" style="margin-top:6px;" onclick="openModal({type:\'addBrand\'})">+ Add Brand</button>';
}

function renderManageTab(){
  const ids = Object.keys(state.config);
  let outletCards = '';
  if(ids.length===0) outletCards = '<div class="empty-state">No outlets yet. Add a brand first, then add outlets below.</div>';
  for(const outletId of ids){
    const outlet = state.config[outletId];
    const brand = state.brands[outlet.brandId];
    const expanded = state.expandedOutletId===outletId;
    const ingredients = ingredientsOf(outlet);
    let itemsHtml = '';
    if(expanded){
      let rows = '';
      for(const ing of ingredients){
        const s = stockFor(outlet, ing.id, ing.createdAt);
        rows += '<div class="item-row"><div><div class="iname">'+escapeHtml(ing.name)+'</div><div class="imeta">'+escapeHtml(ing.unit)+' · opening '+s.opening+' since '+fmtDate(s.baselineDate)+'</div></div>'
          + '<div class="item-row-actions"><button class="btn btn-small btn-ghost" onclick="openModal({type:\'stockTake\',outletId:\''+outletId+'\',ingredientId:\''+ing.id+'\'})">Stock Take</button></div></div>';
      }
      if(ingredients.length===0) rows = '<div style="color:var(--muted-2);font-size:13px;padding:6px 0;">This brand has no ingredients yet.</div>';
      itemsHtml = '<div class="items-panel">'+rows+'</div>';
    }
    outletCards += '<div class="outlet-card"><div class="outlet-card-head"><div class="outlet-card-info"><div class="name">'+escapeHtml(outlet.name)+'</div><div class="meta">'+escapeHtml(brand?brand.name:'(missing brand)')+' · PIN '+escapeHtml(outletId)+'</div></div>'
      + '<div class="outlet-card-actions"><button class="btn btn-small" onclick="toggleExpandOutlet(\''+outletId+'\')">'+(expanded?'Hide Stock':'View Stock')+'</button><button class="btn btn-small btn-danger" onclick="deleteOutlet(\''+outletId+'\')">Delete Outlet</button></div></div>' + itemsHtml + '</div>';
  }
  return '<h2 class="section-title">Outlets</h2>' + outletCards + '<button class="btn btn-primary btn-small" style="margin-top:6px;" onclick="openModal({type:\'addOutlet\'})">+ Add Outlet</button>';
}

function renderModal(){
  const m = state.modal;
  let inner = '';
  let wide = false;
  if(m.type==='addBrand'){
    inner = '<h2>Add Brand</h2><p class="sub">Outlets you assign to this brand will share its ingredients and products.</p>'
      + '<div class="form-field"><label>Brand Name</label><input id="m_brandName" type="text" placeholder="e.g. LBKK"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewBrand()">Add Brand</button></div>';
  } else if(m.type==='addIngredient'){
    inner = '<h2>Add Ingredient</h2><p class="sub">Set the purchase conversion so outlets can enter purchases in the unit they actually buy in.</p>'
      + '<div class="form-field"><label>Ingredient Name</label><input id="m_ingName" type="text" placeholder="e.g. Vanilla Ice Cream"></div>'
      + '<div class="form-field"><label>Stock Unit</label><input id="m_ingUnit" type="text" placeholder="e.g. kg, ml, g, pc"></div>'
      + '<div class="form-field"><label>Purchase Unit</label><input id="m_ingPUnit" type="text" placeholder="e.g. Tub, Bottle, Box"></div>'
      + '<div class="form-field"><label>1 Purchase Unit = how many Stock Units</label><input id="m_ingFactor" type="number" inputmode="decimal" placeholder="e.g. 4.5"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewIngredient()">Add Ingredient</button></div>';
  } else if(m.type==='importJson'){
    wide = true;
    inner = '<h2>Import Recipes</h2><p class="sub">Paste the JSON Claude generates from your recipe sheet. This adds new ingredients/products and updates existing ones by matching names.</p>'
      + '<textarea id="m_importJson" placeholder=\'{"ingredients":[...],"products":[...]}\'></textarea>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="importBrandData()">Import</button></div>';
  } else if(m.type==='addOutlet'){
    let brandOptions = '<option value="">Select a brand…</option>';
    for(const id in state.brands) brandOptions += '<option value="'+id+'">'+escapeHtml(state.brands[id].name)+'</option>';
    inner = '<h2>Add Outlet</h2><p class="sub">The PIN is what outlet staff will type to sign in.</p>'
      + '<div class="form-field"><label>Brand</label><select id="m_outletBrand" class="text-input">'+brandOptions+'</select></div>'
      + '<div class="form-field"><label>Outlet Name</label><input id="m_outletName" type="text" placeholder="e.g. MG Road"></div>'
      + '<div class="form-field"><label>PIN</label><input id="m_outletPin" type="text" inputmode="numeric" placeholder="e.g. 1234"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewOutlet()">Add Outlet</button></div>';
  } else if(m.type==='stockTake'){
    inner = '<h2>Stock Take</h2><p class="sub">Enter what\'s physically counted right now. This resets the running stock-left calculation from today.</p>'
      + '<div class="form-field"><label>Counted Stock</label><input id="m_countedStock" type="number" inputmode="decimal" placeholder="0"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStockTake()">Save</button></div>';
  }
  return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal'+(wide?' modal-wide':'')+'">'+inner+'</div></div>';
}

render();
</script>
</body>
