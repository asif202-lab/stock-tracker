<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#12161C; --panel:#1B212B; --panel-2:#212A37; --border:#2B3441; --border-soft:#242C38;
  --text:#EDEEF0; --muted:#8B93A1; --muted-2:#5C6472;
  --amber:#E8A33D; --teal:#4FB6A6; --teal-dim:#1C3934; --rust:#D96A5A; --rust-dim:#3D2321;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;}
h1{font-family:var(--font-display);font-size:26px;margin:0;letter-spacing:-0.02em;}
h2{font-family:var(--font-display);font-size:21px;margin:0 0 4px 0;}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px 0;line-height:1.5;}
.btn{border-radius:10px;border:1px solid var(--border);padding:13px 20px;font-size:15px;font-weight:600;background:var(--panel-2);color:var(--text);transition:background .15s;}
.btn:hover{background:#283040;}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#1A1206;}
.btn-primary:hover{background:#f0ad4d;}
.btn-ghost{background:transparent;}
.btn-large{width:100%;padding:15px;font-size:15.5px;}
.btn-small{padding:7px 12px;font-size:13px;border-radius:8px;}
.btn-danger{color:var(--rust);border-color:var(--rust-dim);background:var(--rust-dim);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pin-input{width:100%;padding:14px;font-size:22px;letter-spacing:6px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);margin-bottom:14px;font-family:var(--font-mono);}
.text-input{width:100%;padding:12px;font-size:15px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);margin-bottom:12px;}
.error-text{color:var(--rust);font-size:13px;margin:-6px 0 14px 0;}
.success-text{color:var(--teal);font-size:13px;margin:8px 0;}
.outlet-shell{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
.outlet-topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 20px;}
.outlet-name{font-family:var(--font-display);font-size:19px;}
.outlet-date{color:var(--muted);font-size:13px;font-family:var(--font-mono);}
.item-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.item-card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.item-card-name{font-weight:600;font-size:15px;}
.item-card-unit{color:var(--muted-2);font-size:12px;}
.qty-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qty-field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.qty-field input{width:100%;padding:12px;font-size:17px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font-mono);}
.qty-field input:focus{border-color:var(--amber);}
.submit-bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 60%,transparent);padding:16px 0 0;}
.banner{background:var(--teal-dim);border:1px solid #2b5850;color:var(--teal);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
.confirm-wrap{text-align:center;padding-top:60px;}
.confirm-check{font-size:48px;color:var(--teal);margin-bottom:12px;}
.admin-shell{max-width:1080px;margin:0 auto;padding:20px 20px 60px;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.admin-title{font-family:var(--font-display);font-size:20px;}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content;}
.tab-btn{background:transparent;border:none;padding:9px 16px;border-radius:7px;color:var(--muted);font-size:13.5px;font-weight:600;}
.tab-btn.active{background:var(--amber);color:#1A1206;}
.status-strip{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.status-strip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.status-strip-title{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.status-strip-count{font-family:var(--font-mono);font-size:13px;color:var(--muted);}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12.5px;border:1px solid var(--border);background:var(--panel-2);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-ok{background:var(--teal);} .dot-pending{background:var(--rust);}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;}
.field select,.field input[type=date]{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13.5px;}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.summary-card .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.summary-card .value{font-family:var(--font-mono);font-size:22px;font-weight:600;}
.outlet-group{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.outlet-group-head{padding:13px 18px;border-bottom:1px solid var(--border-soft);font-weight:600;font-size:14px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 18px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
td{padding:11px 18px;border-bottom:1px solid var(--border-soft);white-space:nowrap;font-family:var(--font-mono);}
td.name-col{font-family:var(--font-body);white-space:normal;}
tr:last-child td{border-bottom:none;}
.stock-neg{color:var(--rust);}
.empty-state{color:var(--muted);text-align:center;padding:50px 20px;font-size:14px;}
.outlet-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.outlet-card-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.outlet-card-info .name{font-weight:600;font-size:15px;}
.outlet-card-info .meta{color:var(--muted-2);font-size:12px;font-family:var(--font-mono);margin-top:2px;}
.outlet-card-actions{display:flex;gap:8px;}
.items-panel{border-top:1px solid var(--border-soft);padding:14px 18px;background:var(--bg);}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft);gap:10px;flex-wrap:wrap;}
.item-row:last-child{border-bottom:none;}
.item-row .iname{font-weight:500;font-size:13.5px;}
.item-row .imeta{color:var(--muted);font-size:12px;font-family:var(--font-mono);}
.item-row-actions{display:flex;gap:6px;}
.section-title{font-family:var(--font-display);font-size:16px;margin:0 0 12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(8,10,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px;width:100%;max-width:400px;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.form-field input{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:14.5px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.apply-row{display:flex;align-items:flex-end;}
.spinner-text{color:var(--muted);font-size:13.5px;padding:30px;text-align:center;}
@media (prefers-reduced-motion: reduce){*{transition:none !important;}}

</style>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6PTSf3sC-ZtOgUujLrNhYExBq_7lFgJQ",
  authDomain: "inventory-65a2c.firebaseapp.com",
  databaseURL: "https://inventory-65a2c-default-rtdb.firebaseio.com",
  projectId: "inventory-65a2c",
  storageBucket: "inventory-65a2c.firebasestorage.app",
  messagingSenderId: "702447876159",
  appId: "1:702447876159:web:f888ace2ef5037f86fa08a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(dateStr,n){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function fmtDate(s){ const [y,m,d]=s.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d+' '+months[Number(m)-1]+' '+y; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

let state = {
  screen: 'checking',
  loginError: '',
  config: {},
  tab: 'dashboard',
  expandedOutletId: null,
  modal: null,
  today: todayStr(),
  filter: { outletId:'all', startDate: addDays(todayStr(),-6), endDate: todayStr() },
  data: null,
  loading: false,
  statusToday: new Set(),
};

auth.onAuthStateChanged(function(user){
  if(user){
    state.screen = 'admin';
    render();
    loadConfig().then(()=>{ refreshStatus(); loadData(); });
  } else {
    state.screen = 'login';
    render();
  }
});

async function loadConfig(){
  const snap = await db.ref('config').once('value');
  state.config = snap.val() || {};
  render();
}

async function submitLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  state.loginError = '';
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    state.loginError = 'Login failed. Check your email and password.';
    render();
  }
}
function logout(){ auth.signOut(); }

async function refreshStatus(){
  const ids = Object.keys(state.config);
  const results = await Promise.all(ids.map(id => db.ref('entries/'+id+'/'+state.today).once('value').then(s=>({id, exists: s.exists()}))));
  state.statusToday = new Set(results.filter(r=>r.exists).map(r=>r.id));
  render();
}

function setFilter(field, val){ state.filter[field] = val; }
function setTab(tab){ state.tab = tab; render(); }

async function loadData(){
  state.loading = true; state.data = null; render();
  const outletIds = state.filter.outletId==='all' ? Object.keys(state.config) : [state.filter.outletId];
  const results = [];
  for(const outletId of outletIds){
    const outlet = state.config[outletId];
    if(!outlet || !outlet.items) continue;
    let earliestBaseline = null;
    for(const it of outlet.items){ if(earliestBaseline===null || it.baselineDate < earliestBaseline) earliestBaseline = it.baselineDate; }
    if(earliestBaseline===null) continue;
    const fetchStart = earliestBaseline < state.filter.startDate ? earliestBaseline : state.filter.startDate;
    const snap = await db.ref('entries/'+outletId).orderByKey().startAt(fetchStart).endAt(state.filter.endDate).once('value');
    const byDate = snap.val() || {};
    const perItem = {};
    for(const it of outlet.items) perItem[it.id] = {cumSold:0,cumPurchased:0,rangeSold:0,rangePurchased:0};
    for(const date in byDate){
      const dayItems = byDate[date].items || {};
      for(const itemId in dayItems){
        const item = outlet.items.find(i=>i.id===itemId);
        if(!item || date < item.baselineDate) continue;
        const v = dayItems[itemId];
        perItem[itemId].cumSold += v.sold||0;
        perItem[itemId].cumPurchased += v.purchased||0;
        if(date >= state.filter.startDate && date <= state.filter.endDate){
          perItem[itemId].rangeSold += v.sold||0;
          perItem[itemId].rangePurchased += v.purchased||0;
        }
      }
    }
    for(const item of outlet.items){
      const p = perItem[item.id];
      results.push({
        outletId, outletName: outlet.name, itemId: item.id, itemName: item.name, unit: item.unit,
        opening: item.opening, baselineDate: item.baselineDate,
        rangeSold: p.rangeSold, rangePurchased: p.rangePurchased,
        stockLeft: item.opening + p.cumPurchased - p.cumSold,
      });
    }
  }
  state.data = results;
  state.loading = false;
  render();
}

/* ---- manage outlets ---- */
function openModal(m){ state.modal = m; render(); }
function closeModal(){ state.modal = null; render(); }
function setModalError(msg){ state.modal.error = msg; render(); }

async function saveNewOutlet(){
  const name = document.getElementById('m_outletName').value.trim();
  const pin = document.getElementById('m_outletPin').value.trim();
  if(!name || !pin){ setModalError('Enter a name and PIN.'); return; }
  if(state.config[pin]){ setModalError('That PIN is already used by another outlet.'); return; }
  try{
    await db.ref('config/'+pin).set({ name, items: [] });
    state.config[pin] = { name, items: [] };
  }catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null;
  render();
}

async function deleteOutlet(outletId){
  try{ await db.ref('config/'+outletId).remove(); delete state.config[outletId]; }catch(e){}
  render();
}

function toggleExpandOutlet(id){ state.expandedOutletId = state.expandedOutletId===id ? null : id; render(); }

async function saveNewItem(){
  const outletId = state.modal.outletId;
  const outlet = state.config[outletId];
  const name = document.getElementById('m_itemName').value.trim();
  const unit = document.getElementById('m_itemUnit').value.trim() || 'units';
  const opening = Number(document.getElementById('m_itemOpening').value) || 0;
  if(!name){ setModalError('Enter an item name.'); return; }
  const items = (outlet.items||[]).concat([{ id: genId(), name, unit, opening, baselineDate: todayStr() }]);
  try{ await db.ref('config/'+outletId+'/items').set(items); outlet.items = items; }catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null;
  render();
}

async function deleteItem(outletId, itemId){
  const outlet = state.config[outletId];
  const items = (outlet.items||[]).filter(i=>i.id!==itemId);
  try{ await db.ref('config/'+outletId+'/items').set(items); outlet.items = items; }catch(e){}
  render();
}

async function saveStockTake(){
  const { outletId, itemId } = state.modal;
  const outlet = state.config[outletId];
  const counted = document.getElementById('m_countedStock').value;
  if(counted===''){ setModalError('Enter the counted stock.'); return; }
  const items = outlet.items.map(it => it.id===itemId ? Object.assign({}, it, { opening: Number(counted)||0, baselineDate: todayStr() }) : it);
  try{ await db.ref('config/'+outletId+'/items').set(items); outlet.items = items; }catch(e){ setModalError('Could not save. Try again.'); return; }
  state.modal = null;
  state.data = null;
  render();
}

/* ================= render ================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.screen==='checking') html = '<div class="center-wrap"><div class="spinner-text">Loading…</div></div>';
  else if(state.screen==='login') html = renderLogin();
  else if(state.screen==='admin') html = renderAdmin();
  app.innerHTML = html + (state.modal ? renderModal() : '');
}

function renderLogin(){
  return '<div class="center-wrap"><div class="card">'
    + '<h2>Admin Sign-in</h2>'
    + '<p class="sub">Full access to setup and dashboard.</p>'
    + '<input id="emailInput" class="text-input" type="email" placeholder="Email" autofocus>'
    + '<input id="passInput" class="text-input" type="password" placeholder="Password" onkeydown="if(event.key===\'Enter\')submitLogin()">'
    + (state.loginError ? '<div class="error-text">'+escapeHtml(state.loginError)+'</div>' : '')
    + '<button class="btn btn-primary btn-large" onclick="submitLogin()">Sign in</button>'
    + '</div></div>';
}

function renderAdmin(){
  let body = '';
  if(state.tab==='dashboard') body = renderDashboardTab();
  else if(state.tab==='manage') body = renderManageTab();

  return '<div class="admin-shell">'
    + '<div class="admin-topbar"><div class="admin-title">Ops Admin</div><button class="btn btn-ghost btn-small" onclick="logout()">Logout</button></div>'
    + '<div class="tabs">'
    + '<button class="tab-btn '+(state.tab==='dashboard'?'active':'')+'" onclick="setTab(\'dashboard\')">Dashboard</button>'
    + '<button class="tab-btn '+(state.tab==='manage'?'active':'')+'" onclick="setTab(\'manage\')">Manage Outlets</button>'
    + '</div>'
    + body + '</div>';
}

function renderDashboardTab(){
  const outletIds = Object.keys(state.config);
  const total = outletIds.length;
  const submitted = state.statusToday.size;
  let chips = '';
  for(const id of outletIds){
    const ok = state.statusToday.has(id);
    chips += '<span class="chip"><span class="dot '+(ok?'dot-ok':'dot-pending')+'"></span>'+escapeHtml(state.config[id].name)+'</span>';
  }
  if(total===0) chips = '<span style="color:var(--muted-2);font-size:13px;">No outlets set up yet — add one in Manage Outlets.</span>';

  let outletOptions = '<option value="all">All Outlets</option>';
  for(const id of outletIds) outletOptions += '<option value="'+id+'" '+(state.filter.outletId===id?'selected':'')+'>'+escapeHtml(state.config[id].name)+'</option>';

  const statusStrip = '<div class="status-strip"><div class="status-strip-head"><span class="status-strip-title">Today\'s Submissions</span><span class="status-strip-count">'+submitted+' / '+total+'</span></div><div class="chip-row">'+chips+'</div></div>';

  const filters = '<div class="filters">'
    + '<div class="field"><label>Outlet</label><select onchange="setFilter(\'outletId\',this.value)">'+outletOptions+'</select></div>'
    + '<div class="field"><label>From</label><input type="date" value="'+state.filter.startDate+'" onchange="setFilter(\'startDate\',this.value)"></div>'
    + '<div class="field"><label>To</label><input type="date" value="'+state.filter.endDate+'" onchange="setFilter(\'endDate\',this.value)"></div>'
    + '<div class="field apply-row"><button class="btn btn-primary btn-small" onclick="loadData()">Apply</button></div>'
    + '</div>';

  let resultsHtml = '';
  if(state.loading){
    resultsHtml = '<div class="spinner-text">Crunching the numbers…</div>';
  } else if(!state.data || state.data.length===0){
    resultsHtml = '<div class="empty-state">No data for this selection yet.</div>';
  } else {
    let totalSold=0, totalPurchased=0;
    for(const r of state.data){ totalSold += r.rangeSold; totalPurchased += r.rangePurchased; }
    const summary = '<div class="summary-cards">'
      + '<div class="summary-card"><div class="label">Total Sold</div><div class="value">'+totalSold.toLocaleString()+'</div></div>'
      + '<div class="summary-card"><div class="label">Total Purchased</div><div class="value">'+totalPurchased.toLocaleString()+'</div></div>'
      + '<div class="summary-card"><div class="label">Outlets in view</div><div class="value">'+new Set(state.data.map(r=>r.outletId)).size+'</div></div>'
      + '</div>';
    const byOutlet = {};
    for(const r of state.data){ (byOutlet[r.outletId]=byOutlet[r.outletId]||[]).push(r); }
    let groups = '';
    for(const outletId in byOutlet){
      const rows = byOutlet[outletId];
      let trs = '';
      for(const r of rows){
        trs += '<tr><td class="name-col">'+escapeHtml(r.itemName)+'</td><td>'+escapeHtml(r.unit)+'</td><td>'+r.rangeSold.toLocaleString()+'</td><td>'+r.rangePurchased.toLocaleString()+'</td><td class="'+(r.stockLeft<0?'stock-neg':'')+'">'+r.stockLeft.toLocaleString()+'</td></tr>';
      }
      groups += '<div class="outlet-group"><div class="outlet-group-head">'+escapeHtml(rows[0].outletName)+'</div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Unit</th><th>Sold</th><th>Purchased</th><th>Stock Left</th></tr></thead><tbody>'+trs+'</tbody></table></div></div>';
    }
    resultsHtml = summary + groups;
  }
  return statusStrip + filters + resultsHtml;
}

function renderManageTab(){
  const ids = Object.keys(state.config);
  let outletCards = '';
  if(ids.length===0) outletCards = '<div class="empty-state">No outlets yet. Add your first one below.</div>';
  for(const outletId of ids){
    const outlet = state.config[outletId];
    const expanded = state.expandedOutletId===outletId;
    let itemsHtml = '';
    if(expanded){
      let rows = '';
      for(const item of (outlet.items||[])){
        rows += '<div class="item-row"><div><div class="iname">'+escapeHtml(item.name)+'</div><div class="imeta">'+escapeHtml(item.unit)+' · opening '+item.opening+' since '+fmtDate(item.baselineDate)+'</div></div>'
          + '<div class="item-row-actions">'
          + '<button class="btn btn-small btn-ghost" onclick="openModal({type:\'stockTake\',outletId:\''+outletId+'\',itemId:\''+item.id+'\'})">Stock Take</button>'
          + '<button class="btn btn-small btn-danger" onclick="deleteItem(\''+outletId+'\',\''+item.id+'\')">Delete</button>'
          + '</div></div>';
      }
      if(!outlet.items || outlet.items.length===0) rows = '<div style="color:var(--muted-2);font-size:13px;padding:6px 0;">No items yet.</div>';
      itemsHtml = '<div class="items-panel">'+rows+'<div style="margin-top:12px;"><button class="btn btn-small btn-ghost" onclick="openModal({type:\'addItem\',outletId:\''+outletId+'\'})">+ Add Item</button></div></div>';
    }
    outletCards += '<div class="outlet-card">'
      + '<div class="outlet-card-head"><div class="outlet-card-info"><div class="name">'+escapeHtml(outlet.name)+'</div><div class="meta">PIN '+escapeHtml(outletId)+' · '+(outlet.items?outlet.items.length:0)+' items</div></div>'
      + '<div class="outlet-card-actions">'
      + '<button class="btn btn-small" onclick="toggleExpandOutlet(\''+outletId+'\')">'+(expanded?'Hide Items':'Manage Items')+'</button>'
      + '<button class="btn btn-small btn-danger" onclick="deleteOutlet(\''+outletId+'\')">Delete Outlet</button>'
      + '</div></div>' + itemsHtml + '</div>';
  }
  return '<h2 class="section-title">Outlets</h2>' + outletCards
    + '<button class="btn btn-primary btn-small" style="margin-top:6px;" onclick="openModal({type:\'addOutlet\'})">+ Add Outlet</button>';
}

function renderModal(){
  const m = state.modal;
  let inner = '';
  if(m.type==='addOutlet'){
    inner = '<h2>Add Outlet</h2><p class="sub">The PIN is what outlet staff will type to sign in.</p>'
      + '<div class="form-field"><label>Outlet Name</label><input id="m_outletName" type="text" placeholder="e.g. MG Road"></div>'
      + '<div class="form-field"><label>PIN</label><input id="m_outletPin" type="text" inputmode="numeric" placeholder="e.g. 1234"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewOutlet()">Add Outlet</button></div>';
  } else if(m.type==='addItem'){
    inner = '<h2>Add Item</h2><p class="sub">Opening stock is what this outlet has on hand right now.</p>'
      + '<div class="form-field"><label>Item Name</label><input id="m_itemName" type="text" placeholder="e.g. Chicken Burger"></div>'
      + '<div class="form-field"><label>Unit</label><input id="m_itemUnit" type="text" placeholder="e.g. pcs, kg, ltr"></div>'
      + '<div class="form-field"><label>Opening Stock</label><input id="m_itemOpening" type="number" inputmode="decimal" placeholder="0"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveNewItem()">Add Item</button></div>';
  } else if(m.type==='stockTake'){
    inner = '<h2>Stock Take</h2><p class="sub">Enter what\'s physically counted right now. This resets the running stock-left calculation from today.</p>'
      + '<div class="form-field"><label>Counted Stock</label><input id="m_countedStock" type="number" inputmode="decimal" placeholder="0"></div>'
      + (m.error ? '<div class="error-text">'+escapeHtml(m.error)+'</div>' : '')
      + '<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStockTake()">Save</button></div>';
  }
  return '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+inner+'</div></div>';
}

render();
</script>
</body>
</html>
